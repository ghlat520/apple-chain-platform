server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: apple-chain-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/apple_chain?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 30000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: local_redis_pass
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

jwt:
  secret: apple-chain-platform-jwt-secret-key-must-be-at-least-256-bits-long
  expiration: 86400000

# apple-module-file — file upload / download configuration.
# storage.type=local (dev default) | oss (stub today, wired in apple-module-file/storage/OssFileStorageService)
apple:
  file:
    storage:
      type: local
      local:
        root: ${APPLE_FILE_LOCAL_ROOT:/tmp/apple-chain-files}
    max-size: 10485760
    allowed-content-types:
      - image/jpeg
      - image/jpg
      - image/png
      - image/webp
      - image/heic
      - image/heif
    url-prefix: /api/files

minio:
  endpoint: http://127.0.0.1:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: apple-chain

knife4j:
  enable: true
  setting:
    language: zh_cn

# M3 D1+D2: SeaTunnel collection + DataHub lineage hooks
bigdata:
  seatunnel:
    rest-url: http://apple-seatunnel:5801
  datahub:
    enabled: false
    gms-url: http://datahub-gms:8080

ds:
  callback:
    token: ${DS_CALLBACK_TOKEN:changeme}

# M4/M3 GIS: 高德 Web JSAPI 凭证 — 必须通过环境变量或 application-local.yml 注入
# 严禁在本文件 hardcode（已加入 .gitignore：application-local.yml）
amap:
  web-jsapi-key:    ${AMAP_WEB_JSAPI_KEY:}
  web-jsapi-secret: ${AMAP_WEB_JSAPI_SECRET:}

spring.config.import: optional:classpath:application-local.yml

logging:
  level:
    com.apple.chain: debug
    com.baomidou.mybatisplus: warn
