server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: apple-chain-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/apple_chain?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 30000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

jwt:
  secret: apple-chain-platform-jwt-secret-key-must-be-at-least-256-bits-long
  expiration: 86400000

minio:
  endpoint: http://127.0.0.1:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: apple-chain

knife4j:
  enable: true
  setting:
    language: zh_cn

# M3 D1+D2: SeaTunnel collection + DataHub lineage hooks
bigdata:
  seatunnel:
    rest-url: http://apple-seatunnel:5801
  datahub:
    enabled: false
    gms-url: http://datahub-gms:8080

ds:
  callback:
    token: ${DS_CALLBACK_TOKEN:changeme}

logging:
  level:
    com.apple.chain: debug
    com.baomidou.mybatisplus: warn
