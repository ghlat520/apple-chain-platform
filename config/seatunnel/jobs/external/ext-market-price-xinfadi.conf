# =============================================================================
# Job: ext-market-price-xinfadi
# Purpose: 北京新发地批发价 -> Kafka + ClickHouse apple_bigdata_ext.market_price_daily
# Schedule: 1 day @02:30 (DolphinScheduler wf-ext-market-price)
# API: http://www.xinfadi.com.cn/getPriceData.html?prodName=苹果
# Auth: none (公开数据)
# =============================================================================
env {
  parallelism = 1
  job.mode    = "BATCH"
}

source {
  Http {
    result_table_name = "price_raw"
    url    = "http://www.xinfadi.com.cn/getPriceData.html"
    method = "POST"
    body   = "limit=200&current=1&pubDateStartTime=&pubDateEndTime=&prodPcatid=&prodCatid=&prodName=苹果"
    headers {
      Content-Type = "application/x-www-form-urlencoded"
      User-Agent   = "Mozilla/5.0 apple-chain-bigdata/1.0"
    }
    retry             = 3
    retry_backoff_multiplier_ms = 5000
    connection_timeout_ms       = 15000
    socket_timeout_ms           = 60000
    json_field {
      list = "$.list"   # JSONPath
    }
    schema = {
      fields {
        prodName  = "string"
        lowPrice  = "string"
        highPrice = "string"
        avgPrice  = "string"
        place     = "string"
        unitInfo  = "string"
        pubDate   = "string"
      }
    }
  }
}

transform {
  Sql {
    source_table_name = "price_raw"
    result_table_name = "price_flat"
    query = """
      SELECT
        prodName  AS variety,
        place     AS origin,
        CAST(lowPrice AS Decimal(10,2))  AS low_price,
        CAST(highPrice AS Decimal(10,2)) AS high_price,
        CAST(avgPrice AS Decimal(10,2))  AS avg_price,
        unitInfo  AS unit,
        CAST(SUBSTR(pubDate,1,10) AS Date) AS price_date,
        now()     AS ingest_time
      FROM price_raw
    """
  }
}

sink {
  Kafka {
    source_table_name = "price_flat"
    bootstrap.servers = "kafka:9092"
    topic             = "ext.market_price"
    format            = "json"
  }
  Clickhouse {
    source_table_name = "price_flat"
    host        = "clickhouse:8123"
    database    = "apple_bigdata_ext"
    table       = "market_price_daily"
    username    = "apple"
    password    = "${CH_PASSWORD}"
    bulk_size   = 500
  }
}
