# =============================================================================
# Job: ext-consumer-trend
# Purpose: 电商开放平台搜索热度 -> Kafka + ClickHouse apple_bigdata_ext.consumer_trend
# Schedule: 1 day @03:00 (DolphinScheduler wf-ext-consumer)
# API: 京东商智 / 淘宝生意参谋 开放接口 (示例使用京东)
# Auth: AppKey + AppSecret + 签名 (从 Apollo 读取)
# =============================================================================
env {
  parallelism = 1
  job.mode    = "BATCH"
}

source {
  Http {
    result_table_name = "trend_raw"
    url    = "https://api.jd.com/routerjson"
    method = "POST"
    body   = """{"method":"jingdong.shangzhi.keyword.searchTrend","app_key":"${JD_APP_KEY}","timestamp":"${TS}","v":"2.0","sign_method":"md5","sign":"${SIGN}","keyword_list":"苹果,红富士,洛川苹果,烟台苹果","date_type":"day"}"""
    headers {
      Content-Type = "application/json"
      User-Agent   = "apple-chain-bigdata/1.0"
    }
    retry             = 3
    retry_backoff_multiplier_ms = 3000
    connection_timeout_ms       = 10000
    socket_timeout_ms           = 30000
    json_field {
      list = "$.jingdong_shangzhi_keyword_searchTrend_response.result.data"
    }
    schema = {
      fields {
        keyword       = "string"
        searchVolume  = "string"
        clickRate     = "string"
        statDate      = "string"
      }
    }
  }
}

transform {
  Sql {
    source_table_name = "trend_raw"
    result_table_name = "trend_flat"
    query = """
      SELECT
        'JD'                              AS platform,
        keyword                           AS keyword,
        CAST(searchVolume AS BIGINT)      AS search_volume,
        CAST(clickRate AS Decimal(5,2))   AS click_rate,
        CAST(statDate AS Date)            AS stat_date,
        now()                             AS ingest_time
      FROM trend_raw
    """
  }
}

sink {
  Kafka {
    source_table_name = "trend_flat"
    bootstrap.servers = "kafka:9092"
    topic             = "ext.consumer"
    format            = "json"
  }
  Clickhouse {
    source_table_name = "trend_flat"
    host        = "clickhouse:8123"
    database    = "apple_bigdata_ext"
    table       = "consumer_trend"
    username    = "apple"
    password    = "${CH_PASSWORD}"
    bulk_size   = 500
  }
}
