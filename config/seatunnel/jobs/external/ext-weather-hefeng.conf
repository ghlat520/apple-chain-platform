# =============================================================================
# Job: ext-weather-hefeng
# Purpose: 和风天气 Now + 24h 预报 -> Kafka + ClickHouse apple_bigdata_ext.weather_hourly
# Schedule: 5 min (DolphinScheduler wf-ext-weather)
# API: https://devapi.qweather.com/v7/weather/now?location={lat,lon}&key={key}
# Auth: API Key from Apollo (key: bigdata.weather.hefeng.apikey)
# =============================================================================
env {
  parallelism = 1
  job.mode    = "BATCH"
}

source {
  Http {
    result_table_name = "weather_raw"
    url    = "https://devapi.qweather.com/v7/weather/24h"
    method = "GET"
    params {
      location = "${WEATHER_LOCATIONS}"   # 烟台/洛川/灵宝多产区, 由 DS 参数注入
      key      = "${HEFENG_APIKEY}"
    }
    headers {
      Accept-Encoding = "gzip"
      User-Agent      = "apple-chain-bigdata/1.0"
    }
    # 7-field checklist
    retry             = 3
    retry_backoff_multiplier_ms = 2000
    retry_backoff_max_ms        = 30000
    connection_timeout_ms       = 10000
    socket_timeout_ms           = 30000
    schema = {
      fields {
        code    = "string"
        updateTime = "string"
        hourly  = "array<map<string,string>>"
      }
    }
    # rate-limit: 和风开发版 1000 次/天 -> 5min 一次 = 288 次/天 OK
  }
}

transform {
  Sql {
    source_table_name = "weather_raw"
    result_table_name = "weather_flat"
    query = """
      SELECT
        location_id           AS location_id,
        h.fxTime              AS forecast_time,
        CAST(h.temp AS Float) AS temp,
        CAST(h.humidity AS Float) AS humidity,
        CAST(h.precip AS Float)   AS precip,
        h.text                AS weather_text,
        now()                 AS ingest_time
      FROM weather_raw
      LATERAL VIEW explode(hourly) t AS h
    """
  }
}

sink {
  Kafka {
    source_table_name = "weather_flat"
    bootstrap.servers = "kafka:9092"
    topic             = "ext.weather"
    format            = "json"
  }
  Clickhouse {
    source_table_name = "weather_flat"
    host        = "clickhouse:8123"
    database    = "apple_bigdata_ext"
    table       = "weather_hourly"
    username    = "apple"
    password    = "${CH_PASSWORD}"
    bulk_size   = 1000
    # error-sink: 写入失败投递到 DLQ topic
    save_mode_create_template = "CREATE TABLE IF NOT EXISTS"
  }
}
