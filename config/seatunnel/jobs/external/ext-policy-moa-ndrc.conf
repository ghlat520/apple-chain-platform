# =============================================================================
# Job: ext-policy-moa-ndrc
# Purpose: 农业农村部 + 国家发改委 RSS -> Kafka + ClickHouse apple_bigdata_ext.policy_article
# Schedule: 1 day @06:00 (DolphinScheduler wf-ext-policy)
# Source: 多 RSS 源 union (MOA + NDRC + 省厅子源)
# Auth: none
# Compliance: F-805 监管溯源 — TTL 1825 天
# =============================================================================
env {
  parallelism = 1
  job.mode    = "BATCH"
}

source {
  Http {
    result_table_name = "policy_moa"
    url    = "http://www.moa.gov.cn/govpublic/rss.xml"
    method = "GET"
    headers {
      Accept       = "application/rss+xml"
      User-Agent   = "apple-chain-bigdata/1.0"
    }
    retry             = 3
    retry_backoff_multiplier_ms = 5000
    connection_timeout_ms       = 15000
    socket_timeout_ms           = 60000
    format = "xml"
    schema = {
      fields {
        title       = "string"
        link        = "string"
        description = "string"
        pubDate     = "string"
        category    = "string"
      }
    }
  }
  Http {
    result_table_name = "policy_ndrc"
    url    = "https://www.ndrc.gov.cn/rss/zcfb.xml"
    method = "GET"
    headers {
      Accept     = "application/rss+xml"
      User-Agent = "apple-chain-bigdata/1.0"
    }
    retry             = 3
    format = "xml"
    schema = {
      fields {
        title       = "string"
        link        = "string"
        description = "string"
        pubDate     = "string"
        category    = "string"
      }
    }
  }
}

transform {
  Sql {
    result_table_name = "policy_unioned"
    query = """
      SELECT 'MOA' AS source, title, link AS url, description AS summary,
             CAST(pubDate AS Date) AS pub_date, category, now() AS ingest_time
      FROM policy_moa
      UNION ALL
      SELECT 'NDRC' AS source, title, link AS url, description AS summary,
             CAST(pubDate AS Date) AS pub_date, category, now() AS ingest_time
      FROM policy_ndrc
    """
  }
}

sink {
  Kafka {
    source_table_name = "policy_unioned"
    bootstrap.servers = "kafka:9092"
    topic             = "ext.policy"
    format            = "json"
  }
  Clickhouse {
    source_table_name = "policy_unioned"
    host        = "clickhouse:8123"
    database    = "apple_bigdata_ext"
    table       = "policy_article"
    username    = "apple"
    password    = "${CH_PASSWORD}"
    bulk_size   = 200
  }
}
