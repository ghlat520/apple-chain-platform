# =============================================================================
# Job: internal-apple-chain-cdc
# Purpose: 实时采集 apple_chain 业务库 binlog -> Kafka (替代 Canal)
# Decision: M3 D1 — SeaTunnel MySQL-CDC 全量替代 Canal
# Schedule: 常驻流式 (DolphinScheduler 仅做健康检查)
# =============================================================================
env {
  parallelism = 2
  job.mode    = "STREAMING"
  checkpoint.interval = 10000
}

source {
  MySQL-CDC {
    result_table_name = "apple_chain_cdc"
    base-url      = "jdbc:mysql://host.docker.internal:3306/apple_chain"
    username      = "canal"
    password      = "${MYSQL_CDC_PASSWORD}"
    server-id     = "5400-5404"
    # 监听全部业务表 (排除 flyway / quartz / 大数据自身管理表)
    table-names   = ["apple_chain.t_orchard", "apple_chain.t_batch", "apple_chain.t_traceability", "apple_chain.t_finance_loan", "apple_chain.t_finance_insurance", "apple_chain.t_finance_futures", "apple_chain.t_finance_deposit", "apple_chain.t_iot_device"]
    startup.mode  = "initial"
    # auth / retry / timeout / rate-limit / schema / error-sink / openlineage 7-field checklist
    connect.timeout    = 30000
    connect.max-retries = 3
    snapshot.split.size = 8096
  }
}

transform {
  # 预留: 后续可加 OpenLineage transform 元数据注入
}

sink {
  Kafka {
    source_table_name = "apple_chain_cdc"
    bootstrap.servers = "kafka:9092"
    topic             = "cdc.apple_chain.${table_name}"
    format            = "json"
    semantics         = "AT_LEAST_ONCE"
    producer {
      acks            = "all"
      retries         = 3
      max.in.flight.requests.per.connection = 1
    }
  }
}
