# ============================================================
# Canal instance configuration for apple_chain MySQL source
# ============================================================
# Prerequisites (on the source MySQL):
#   [mysqld]
#   log-bin=mysql-bin
#   binlog-format=ROW
#   server-id=1
#
#   CREATE USER 'canal'@'%' IDENTIFIED BY 'canal';
#   GRANT SELECT, REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'canal'@'%';
#   FLUSH PRIVILEGES;
# ============================================================

canal.instance.mysql.slaveId=1001
canal.instance.gtidon=false

canal.instance.master.address=host.docker.internal:3306
canal.instance.master.journal.name=
canal.instance.master.position=
canal.instance.master.timestamp=
canal.instance.master.gtid=

canal.instance.dbUsername=canal
canal.instance.dbPassword=canal
canal.instance.connectionCharset=UTF-8
canal.instance.defaultDatabaseName=apple_chain
canal.instance.enableDruid=false

# Only ship apple_chain.* tables
canal.instance.filter.regex=apple_chain\\..*
canal.instance.filter.black.regex=apple_chain\\.flyway_schema_history

# Kafka destination: dynamic topic = cdc.apple_chain.<table>
canal.mq.topic=cdc.apple_chain.default
canal.mq.dynamicTopic=cdc.apple_chain..*:apple_chain\\..*
canal.mq.partition=0
canal.mq.partitionsNum=1
